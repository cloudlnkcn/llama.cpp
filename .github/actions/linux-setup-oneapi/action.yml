name: "Linux - Setup Intel oneAPI Toolkit"
description: "Setup Intel oneAPI DPC++/SYCL toolchain and runtime for Linux"

inputs:
  toolkit:
    description: "oneAPI Base Toolkit package set to install (compiler-rt or full toolkit subset)"
    required: false
    default: "intel-oneapi-compiler-dpcpp-cpp intel-oneapi-runtime-dpcpp intel-oneapi-runtime-libs intel-oneapi-runtime-opencl"

runs:
  using: "composite"
  steps:
    - name: Setup Intel oneAPI
      shell: bash
      run: |
        set -eux
        # Add the Intel oneAPI apt repository and signing key.
        sudo mkdir --parents --mode=0755 /etc/apt/keyrings
        wget -qO - https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
          | gpg --dearmor \
          | sudo tee /etc/apt/keyrings/oneapi.gpg > /dev/null

        echo "deb [signed-by=/etc/apt/keyrings/oneapi.gpg] https://apt.repos.intel.com/oneapi all main" \
          | sudo tee /etc/apt/sources.list.d/oneAPI.list

        sudo apt-get update
        # shellcheck disable=SC2086  # intentional word-splitting of package list
        sudo apt-get install -y ${{ inputs.toolkit }}
